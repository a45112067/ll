<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مدونة أحمد أيمن يحيى">
  <title>المدونة | أحمد أيمن</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js"></script>
  <style>
    :root { --bg:#f1f5f9; --surface:#fff; --ink:#0f172a; --ink-soft:#475569; --brand:#2563eb; --brand-dark:#1d4ed8; --accent:#ff9800; --border:#e2e8f0; }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',Tahoma,sans-serif; }
    body { background:var(--bg); }
    a { color:inherit; text-decoration:none; }

    header.site { background:linear-gradient(135deg,var(--brand),var(--brand-dark)); color:#fff; padding:4.5rem 1.2rem 3.2rem; text-align:center; }
    header.site h1 { font-size:2.1rem; margin-bottom:.6rem; position:relative; display:inline-block; }
    header.site h1::after { content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:60px; height:4px; border-radius:4px; background:var(--accent); }
    header.site p { opacity:.92; font-size:1rem; max-width:560px; margin:1rem auto 0; line-height:1.8; }

    .container { max-width:880px; margin:0 auto; padding:2.2rem 1rem 4rem; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:1.8rem; }
    .toolbar input { flex:1; min-width:200px; padding:12px 16px; border:1.5px solid var(--border); border-radius:13px; font-family:inherit; font-size:.95rem; outline:none; background:#fff; }
    .toolbar input:focus { border-color:var(--brand); box-shadow:0 0 0 4px rgba(37,99,235,.1); }
    .filter-btn { padding:10px 16px; border:1.5px solid var(--border); border-radius:13px; background:#fff; color:var(--ink-soft); font-weight:700; font-size:.85rem; cursor:pointer; transition:.2s; }
    .filter-btn.active, .filter-btn:hover { border-color:var(--brand); color:var(--brand); background:#eff6ff; }

    .post { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:22px; margin-bottom:16px; display:block; transition:.25s; box-shadow:0 4px 14px rgba(15,23,42,.04); }
    .post:hover { transform:translateY(-3px); border-color:var(--brand); box-shadow:0 14px 34px rgba(37,99,235,.14); }
    .post h2 { font-size:1.25rem; margin-bottom:10px; color:var(--ink); }
    .meta { font-size:.8rem; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .meta .tag { display:inline-block; padding:3px 11px; border-radius:999px; background:rgba(37,99,235,.1); color:var(--brand); font-weight:700; }
    .meta i { margin-left:5px; }
    .post .excerpt { color:var(--ink-soft); line-height:1.8; font-size:.93rem; }

    .posts-empty { text-align:center; color:var(--ink-soft); padding:3rem 0; }
    .back-link { display:inline-flex; align-items:center; gap:8px; color:#fff; background:rgba(255,255,255,.16); padding:10px 18px; border-radius:12px; font-weight:700; font-size:.9rem; margin-bottom:2rem; }
    .back-link:hover { background:rgba(255,255,255,.25); }

    /* Read view */
    #readView { display:none; }
    .article { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px; }
    .article h1 { font-size:1.6rem; margin-bottom:12px; color:var(--ink); }
    .article .cover { width:100%; max-height:320px; object-fit:cover; border-radius:14px; margin:14px 0; }
    .article .body, .article .body-en { line-height:2; color:#334155; font-size:1rem; }
    .article .body { margin-top:14px; }

    footer { text-align:center; color:var(--ink-soft); font-size:.85rem; padding:2rem 1rem; }
    @media (max-width:560px) {
      header.site h1 { font-size:1.6rem; }
      .article { padding:20px; }
      .post { padding:18px; }
    }
  </style>
</head>
<body>

<header class="site">
  <div class="container" style="padding:0 0 0 0;">
    <a class="back-link" href="index.html"><i class="fas fa-arrow-right"></i> العودة إلى الرئيسية</a>
    <h1>مدونة أحمد أيمن</h1>
    <p>أفكار ومقالات في التسويق والبرمجة وتطوير الأعمال.</p>
  </div>
</header>

<main class="container" id="listView">
  <div class="toolbar">
    <input id="searchInput" placeholder="ابحث في المقالات...">
    <button class="filter-btn active" data-filter="all">الكل</button>
    <button class="filter-btn" data-filter="برمجة">برمجة</button>
    <button class="filter-btn" data-filter="تسويق">تسويق</button>
    <button class="filter-btn" data-filter="أعمال">أعمال</button>
    <button class="filter-btn" data-filter="تطوير">تطوير</button>
  </div>
  <div id="postsContainer"></div>
</main>

<main class="container" id="readView">
  <a class="back-link" id="backToList" href="#"><i class="fas fa-arrow-right"></i> رجوع إلى المدونة</a>
  <article class="article" id="articleContent"></article>
</main>

<footer>© أحمد أيمن يحيى — جميع الحقوق محفوظة</footer>

<script>
  const app = firebase.initializeApp(window.FIREBASE_CONFIG);
  const db = firebase.firestore();
  let allPosts = [];
  let currentFilter = 'all';
  let searchTerm = '';

  async function loadPosts() {
    try {
      const snap = await db.collection('posts').where('status', '==', 'published').orderBy('date', 'desc').get();
      allPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    } catch (e) {
      document.getElementById('postsContainer').innerHTML = '<div class="posts-empty">تعذّر تحميل المقالات.</div>';
    }
  }

  function render() {
    let list = allPosts;
    if (currentFilter !== 'all') list = list.filter(p => (p.tags || []).some(t => t.trim() === currentFilter));
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      list = list.filter(p =>
        (p.title_ar + ' ' + p.excerpt_ar + ' ' + p.content_ar + ' ' +
         (p.title_en||'') + ' ' + (p.excerpt_en||'')).toLowerCase().includes(q)
      );
    }
    const el = document.getElementById('postsContainer');
    if (!list.length) { el.innerHTML = '<div class="posts-empty">لا توجد مقالات مطابقة.</div>'; return; }
    el.innerHTML = list.map(p => `
      <a class="post" href="#" onclick="openPost('${p.id}');return false;">
        <h2>${esc(p.title_ar || p.title_en)}</h2>
        <div class="meta">
          <span><i class="far fa-calendar"></i>${esc(p.date || '')}</span>
          ${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
        </div>
        <p class="excerpt">${esc(p.excerpt_ar || p.excerpt_en || '')}</p>
      </div>`).join('');
  }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

  function openPost(id){
    const p = allPosts.find(x=>x.id===id); if(!p) return;
    document.getElementById('articleContent').innerHTML = `
      ${p.image ? `<img class="cover" src="${esc(p.image)}" alt="">` : ''}
      <h1>${esc(p.title_ar || p.title_en)}</h1>
      <div class="meta"><span><i class="far fa-calendar"></i>${esc(p.date||'')}</span></div>
      <div class="body">${nl2br(p.content_ar || p.content_en || '')}</div>`;
    document.getElementById('listView').style.display='none';
    document.getElementById('readView').style.display='block';
    window.scrollTo(0,0);
  }
  document.getElementById('backToList').addEventListener('click', e => { e.preventDefault(); showList(); });
  function showList(){ document.getElementById('readView').style.display='none'; document.getElementById('listView').style.display='block'; }

  document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); currentFilter=b.dataset.filter; render();
  }));
  document.getElementById('searchInput').addEventListener('input', e=>{ searchTerm=e.target.value; render(); });

  loadPosts();
</script>
</body>
</html>
